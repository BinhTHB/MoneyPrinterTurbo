name: YouTube Automation

on:
  workflow_dispatch:
    inputs:
      channels_file:
        description: "Path to YouTube channels config JSON"
        required: true
        default: "config/youtube_channels.channel_1.json"
      counts:
        description: "Count overrides, e.g. cat_shorts=1,tech_shorts=2,all=1"
        required: false
        default: "all=1"
      dry_run:
        description: "Skip video generation and upload"
        required: true
        type: boolean
        default: true
      commit_history:
        description: "Commit automation-history back to the repo"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  YOUTUBE_CLIENT_JSON_CHANNEL_1: ${{ secrets.YOUTUBE_CLIENT_JSON_CHANNEL_1 }}
  YOUTUBE_TOKEN_JSON_CHANNEL_1: ${{ secrets.YOUTUBE_TOKEN_JSON_CHANNEL_1 }}
  YOUTUBE_CLIENT_JSON_CHANNEL_2: ${{ secrets.YOUTUBE_CLIENT_JSON_CHANNEL_2 }}
  YOUTUBE_TOKEN_JSON_CHANNEL_2: ${{ secrets.YOUTUBE_TOKEN_JSON_CHANNEL_2 }}
  YOUTUBE_CLIENT_JSON_CHANNEL_3: ${{ secrets.YOUTUBE_CLIENT_JSON_CHANNEL_3 }}
  YOUTUBE_TOKEN_JSON_CHANNEL_3: ${{ secrets.YOUTUBE_TOKEN_JSON_CHANNEL_3 }}

jobs:
  auto-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore topic history cache
        uses: actions/cache/restore@v4
        with:
          path: automation-history
          key: youtube-automation-history-${{ github.run_id }}
          restore-keys: |
            youtube-automation-history-

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pytest

      - name: Configure LLM for runner
        run: |
          echo "" >> config.toml
          echo "[app]" >> config.toml
          echo "llm_provider = \"${{ env.LLM_PROVIDER }}\"" >> config.toml
          echo "${{ env.API_KEY_FIELD }} = \"${{ secrets.AUTOMATION_GEMINI_API_KEY }}\"" >> config.toml
          echo "gemini_model_name = \"gemini-3.1-flash-lite\"" >> config.toml
          echo "pexels_api_keys = [\"${{ secrets.PEXELS_API_KEY }}\"]" >> config.toml
          echo "pixabay_api_keys = [\"${{ secrets.PIXABAY_API_KEY }}\"]" >> config.toml
          echo "gemini_tts_model_name = \"gemini-3.1-flash-tts-preview\"" >> config.toml
          echo "gemini_live_tts_enabled = false" >> config.toml
          echo "gemini_live_tts_model_name = \"gemini-3.1-flash-live-preview\"" >> config.toml
          echo "" >> config.toml
          echo "[ui]" >> config.toml
          echo "tts_server = \"gemini-tts\"" >> config.toml
          echo "voice_name = \"gemini:Aoede-Female\"" >> config.toml
          echo "voice_rate = 1.2" >> config.toml
          echo "subtitle_position = \"custom\"" >> config.toml
          echo "custom_position = 70.0" >> config.toml
          echo "text_fore_color = \"#FFFFFF\"" >> config.toml
          echo "font_size = 51" >> config.toml
          echo "stroke_color = \"#141414\"" >> config.toml
          echo "stroke_width = 0.0" >> config.toml
        env:
          LLM_PROVIDER: gemini
          API_KEY_FIELD: gemini_api_key

      - name: Validate automation modules
        run: |
          uv run python -m pytest test/automation test/services/test_youtube_upload.py test/services/test_cli.py -q

      - name: Run YouTube automation
        run: |
          uv run python cli.py auto-youtube \
            --channels-file "${{ inputs.channels_file }}" \
            --history-dir automation-history \
            --counts "${{ inputs.counts }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --output-file automation-results.json

      - name: Upload automation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-automation-results
          path: |
            automation-results.json
            automation-history
          if-no-files-found: ignore
          retention-days: 30

      - name: Save topic history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: automation-history
          key: youtube-automation-history-${{ github.run_id }}