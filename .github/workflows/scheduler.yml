name: Daily Scheduler

on:
  schedule:
    - cron: '0 17 * * *' # 12:00 PM EST (17:00 UTC) daily — best time for Shorts

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: branch
        run: |
          # Cron run: use secret TARGET_BRANCH or fallback to main
          TARGET="${{ secrets.TARGET_BRANCH }}"
          if [[ -z "$TARGET" ]]; then
            TARGET="main"
          fi
          echo "Cron run: using target branch = $TARGET"
          echo "target_branch=$TARGET" >> $GITHUB_OUTPUT
      - name: Trigger YouTube Automation on target branch
        run: |
          # Trigger all 3 channels in sequence (not parallel, to avoid rate limits)
          for ch in "config/youtube_channels.channel_1.json" \
                    "config/youtube_channels.channel_2.json" \
                    "config/youtube_channels.channel_3.json"; do
            echo "Triggering workflow for $ch on branch ${{ steps.branch.outputs.target_branch }}..."
            gh workflow run "YouTube Automation" \
              --repo BinhTHB/MoneyPrinterTurbo \
              --ref "${{ steps.branch.outputs.target_branch }}" \
              -f dry_run=false \
              -f commit_history=false \
              -f channels_file="$ch" \
              -f counts="all=1"
            sleep 10  # small delay between triggers
          done
        env:
          GH_TOKEN: ${{ github.token }}