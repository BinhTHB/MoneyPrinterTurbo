name: Daily Scheduler

on:
  schedule:
    - cron: '0 17 * * *' # 12:00 PM EST (17:00 UTC) daily — best time for Shorts

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger YouTube Automation on working-branch
        run: |
          gh workflow run "YouTube Automation" \
            --ref working-branch \
            -f dry_run=false \
            -f commit_history=true \
            -f channels_file="config/youtube_channels.channel_1.json" \
            -f counts="all=1"
        env:
          GH_TOKEN: ${{ github.token }}
